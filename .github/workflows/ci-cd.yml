name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-test-image
    if: github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG_DATA != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"
      - name: Aplicar banco, configuração e aplicação
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n oficina create secret generic oficina-api-secret --from-literal=SPRING_DATASOURCE_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' --from-literal=APP_JWT_SECRET='${{ secrets.APP_JWT_SECRET }}' --from-literal=APP_INTEGRATION_TOKEN='${{ secrets.APP_INTEGRATION_TOKEN }}' --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml -f k8s/postgres.yaml
          sed "s|:latest|:${{ github.sha }}|" k8s/app.yaml | kubectl apply -f -
          kubectl apply -f k8s/hpa.yaml
