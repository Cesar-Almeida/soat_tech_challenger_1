apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: oficina
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: oficina }
            - { name: POSTGRES_USER, value: oficina }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: oficina-api-secret, key: SPRING_DATASOURCE_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U oficina -d oficina"] }, initialDelaySeconds: 5 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oficina
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
