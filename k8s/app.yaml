apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels: { app: oficina-api }
  template:
    metadata:
      labels: { app: oficina-api }
    spec:
      containers:
        - name: oficina-api
          image: ghcr.io/cesar-almeida/soat_tech_challenger_1:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: oficina-api-config }
            - secretRef: { name: oficina-api-secret }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
spec:
  selector: { app: oficina-api }
  ports: [{ port: 80, targetPort: 8080 }]
  type: ClusterIP
